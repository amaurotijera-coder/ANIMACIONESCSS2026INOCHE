<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CLIP PATH</title>
<style>
    *{
        padding: 0px;
        margin: 0px;
    }
    body{
    background-image: url('IMG/FONDO.jpg');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;
}
    .contenedor{
        width: 400px;
        height: 700px;
        background-color: transparent;
        position: relative;
        margin: 0 auto;
        overflow: hidden;
    }
    .gorrito{
        width: 100px;
        height: 100px;
        background-color: green;
        clip-path: polygon(52% 7%, 5% 100%, 95% 100%);
        position:absolute;
        left: 150px;
        top: 114px;
    }
    .cabeza{
        width: 100px;
        height: 100px;

        background-image: url('IMG/rostro\ xd.png');
        background-size: cover;
        background-position: center;

        background-color: pink;
        clip-path: circle(44.0% at 50% 50%);
        position:absolute;
        left: 150px;
        top: 208px;
    }
       .cuerpo{
        width: 100px;
        height: 100px;
         background-image: url('IMG/cuerpo.png');
        background-size: cover;
        background-position: center;

        background-color: orange;
        clip-path: polygon(32% 0, 65% 0, 84% 100%, 12% 100%);
        position:absolute;
        left: 150px;
        top: 300px;
    }
       .brazoD{
        width: 100px;
        height: 100px;
        background-image: url('IMG/BRAZO\ D.jpg');
        background-size: cover;
        background-position: center;

        background-color: pink;
        clip-path: polygon(0 41%, 35% 40%, 35% 23%, 64% 49%, 35% 82%, 35% 61%, 0 61%);
        position:absolute;
        left: 225px;
        top: 300px;
    }
       .brazoI{
        width: 100px;
        height: 100px;

        background-image: url('IMG/BRAZO\ I.webp');
        background-size: cover;
        background-position: center;

        background-color: pink;
        clip-path: polygon(45% 28%, 46% 43%, 72% 42%, 72% 65%, 44% 66%, 44% 84%, 23% 56%);
        position:absolute;
        left: 100px;
        top: 300px;
    }
       .pieD{
        width: 100px;
        height: 100px;
        background-color: brown;
        clip-path: ellipse(21% 11% at 50% 50%);
        position:absolute;
        left: 200px;
        top: 360px;
    }
       .pieI{
        width: 100px;
        height: 100px;
        background-color: brown;
        clip-path: ellipse(21% 11% at 50% 50%);
        position:absolute;
        left: 100px;
        top: 360px;
    }
    
</style>



</head>
<body>

    <div class="contenedor">
        <div class="gorrito"></div>
        <div class="cabeza"></div>
        <div class="cuerpo"></div>
        <div class="brazoD"></div>
        <div class="brazoI"></div>
        <div class="pieD"></div>
        <div class="pieI"></div>




    </div>

</body>
</html>
