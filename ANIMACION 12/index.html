<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video animación 2 - Blender</title>
    <style>
        body{
            text-align: center;
        }
        h1{
            margin: 10px 0;
        }
        .volver{
            position: fixed;
            top: 5px;
            left: 20px; 
            width: 140px;   
            height: 40px;   
            background: yellow;
            color: black;
            text-decoration: none;
            text-align: center;
            line-height: 40px; 
            font-size: 16px;   
            font-family: Arial;
            border-radius: 12px;
            transition: 0.4s;
            box-shadow: 0px 8px 15px rgba(0,0,0,0.4);
            z-index: 10;
        }
    </style>
</head>
<body>
    <a href="../index.html" class="volver">VOLVER</a>
