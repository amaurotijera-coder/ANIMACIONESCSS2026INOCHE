<html lang="es">
    <head>
        <title></title>
        <style>
            *{
                margin:0;
                padding:0;   
            }
            #contenedor{
                width: 400px;
                height: 200px;
                border: 1px solid black;
                position: relative;
                margin: 0 auto; /* centrar el contenedor*/
                overflow: hidden; /* oculta todo lo que contiene */
            }
            #cuadrito{
                width: 100px;
                height: 100px;
                position: absolute; /* obligatorio para mover el div**/
                top: 50px;
                left:-100px;
                animation: cuadrito 3s infinite;
                animation-timing-function: linear; /* define la forma de moverse*/ 

            }
            @keyframes cuadrito{
                from{
                    left: -100px;

                }
                to{
                    left: 500px;

                }
            }
            #cuadrito img{
                width: 100px;
                height: 100px;
            }
             .volver{
    position: fixed;
    top: 5px;
    left: 20px; 
    width: 140px;   
    height: 40px;   
    background: yellow;
    color: black;
    text-decoration: none;
    text-align: center;
    line-height: 40px; 
    font-size: 16px;   
    font-family: Arial;
    border-radius: 12px;
    transition: 0.4s;
    box-shadow: 0px 8px 15px rgba(0,0,0,0.4);
    z-index: 10;
}
        </style>
    </head>
    <body>
        <a href="../index.html" class="volver"> VOLVER PAPU </a> 
        <div id="contenedor">
            <div id = "cuadrito">
                <img src="../img/megaman.gif" alt="">
            </div>
        </div>

    </body>
</html>
